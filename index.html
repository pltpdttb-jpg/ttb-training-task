        // ================= HELPERS (WITH SAFETY CHECKS) =================
        const getAvatarInitials = (fullName) => {
            if(!fullName) return 'U'; // Safety check
            const cleanName = fullName.replace(/\(.*\)/, '').trim();
            const parts = cleanName.split(/\s+/);
            if (parts.length >= 2 && parts[0].length > 0 && parts[1].length > 0) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            if (parts[0] && parts[0].length > 0) {
                return parts[0].substring(0, 2).toUpperCase();
            }
            return 'U';
        };

        const formatNameShort = (profile) => {
            if (!profile) return "Unknown";
            const fName = profile.full_name || 'Unknown'; // Safety check
            const firstName = fName.split(' ')[0];
            const dName = profile.display_name ? ` (${profile.display_name})` : '';
            return `${firstName}${dName}`;
        };

        const formatTime = (t) => t ? t.substring(0, 5) : '00:00';
        const formatDateThai = (d) => new Date(d).toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

        const buildTaskString = (task) => {
            let parts = [];
            if (task.audience && task.audience !== 'ไม่ระบุ' && task.audience.trim() !== '') parts.push(task.audience + ":");
            const hasFormat = task.format && task.format !== 'ไม่ระบุ' && task.format.trim() !== '';
            if (hasFormat) parts.push(`(${task.format})`);
            parts.push(task.course_details || 'งานไม่มีชื่อ');
            const hasTime = task.start_time && task.start_time !== '00:00:00' && task.start_time !== '00:00';
            if (hasFormat && hasTime) parts.push(`${formatTime(task.start_time)}-${formatTime(task.end_time)}`);
            if (task.location && task.location !== 'ไม่ระบุ' && task.location.trim() !== '') parts.push(task.location);
            return parts.join(" ");
        };

        const getAudienceClass = (aud) => ({ 'ttb': 'audience-ttb', 'PD ttb': 'audience-pd', 'PRU': 'audience-pru', 'Customer': 'audience-customer' }[aud] || 'audience-none');
        const showLoading = (show) => document.getElementById('loading-overlay').classList.toggle('hidden', !show);
        const setActiveNav = (id) => {
            document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('text-blue-600'); b.classList.add('text-slate-400'); });
            const btn = document.getElementById(id); if(btn) { btn.classList.add('text-blue-600'); btn.classList.remove('text-slate-400'); }
        };

    <script>
        // --- 1. AUTH & INITIALIZATION ---
        async function handleLogin(e) {
            e.preventDefault(); 
            showLoading(true);
            const inputId = document.getElementById('login-id').value.trim();
            const password = document.getElementById('login-password').value;
            let email = inputId;
            
            try {
                if (!inputId.includes('@')) {
                    const { data, error } = await supabaseClient.from('profiles').select('email').eq('user_id_code', inputId).single();
                    if (error || !data) throw new Error("ไม่พบ User ID นี้ในระบบ");
                    email = data.email;
                }
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                await initApp(data.user);
            } catch (err) {
                const errBox = document.getElementById('login-error');
                errBox.textContent = err.message === 'Invalid login credentials' ? 'รหัสผ่านไม่ถูกต้อง' : err.message;
                errBox.classList.remove('hidden');
                showLoading(false);
            }
        }

        async function initApp(user) {
            currentUser = user;
            try {
                // Fetch current user profile
                const { data: profile, error: profErr } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
                if (profErr || !profile) {
                    console.warn("ไม่พบ Profile ในฐานข้อมูล ใช้ค่า Default");
                    userProfile = { full_name: user.email.split('@')[0], display_name: 'User', role: 'trainer', team: '' };
                } else {
                    userProfile = profile;
                }

                // Fetch all profiles (WITH SAFETY CHECKS)
                const { data: profiles } = await supabaseClient.from('profiles').select('*');
                if (profiles) {
                    allProfiles = profiles.filter(p => {
                        const fname = p.full_name || '';
                        const eml = p.email || '';
                        const uid = p.user_id_code || '';
                        // Filter out specific accounts safely
                        return !fname.includes('อลงกรณ์') && !eml.includes('korn.ak28') && uid !== 'ttb_ap';
                    });
                }

                // Update Header UI
                document.getElementById('header-name').textContent = formatNameShort(userProfile);
                document.getElementById('header-role').textContent = (userProfile.role || 'trainer').toUpperCase();
                document.getElementById('header-avatar').textContent = getAvatarInitials(userProfile.full_name);
                
                // Show Main App
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                
                renderDashboard();
            } catch (error) { 
                console.error("Critical Init Error:", error);
                alert('เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + error.message); 
                showLoading(false);
            }
        }

        async function handleLogout() { 
            if(confirm('ยืนยันออกจากระบบ?')) { 
                await supabaseClient.auth.signOut(); 
                window.location.reload(); 
            } 
        }

        // --- 2. MAIN DASHBOARD ---
        async function renderDashboard() {
            showLoading(true); setActiveNav('nav-home');
            try {
                const now = new Date();
                const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
                const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
                const todayStr = now.toISOString().split('T')[0];
                const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
                const tomorrowStr = tomorrow.toISOString().split('T')[0];

                const { data: monthTasks } = await supabaseClient.from('tasks')
                    .select('*, profiles!tasks_trainer_id_fkey(full_name, display_name)')
                    .eq('trainer_id', currentUser.id)
                    .gte('date', startOfMonth)
                    .lte('date', endOfMonth)
                    .order('start_time');
                
                const { data: upcomingTasks } = await supabaseClient.from('tasks')
                    .select('*, profiles!tasks_trainer_id_fkey(full_name, display_name)')
                    .eq('trainer_id', currentUser.id)
                    .in('date', [todayStr, tomorrowStr])
                    .order('date')
                    .order('start_time');

                const totalTasks = monthTasks.length;
                const f2fCount = monthTasks.filter(t => t.format === 'F2F').length;
                const onlineCount = monthTasks.filter(t => t.format === 'Online').length;
                const totalHours = monthTasks.reduce((acc, t) => { 
                    if (t.is_leave || !t.format || t.format==='ไม่ระบุ') return acc; 
                    const h1 = parseInt(t.start_time.split(':')[0]); 
                    const h2 = parseInt(t.end_time.split(':')[0]); 
                    return acc + (h2 - h1); 
                }, 0);
                
                const weeks = [0, 0, 0, 0, 0]; 
                monthTasks.forEach(t => { 
                    const d = new Date(t.date); 
                    const weekNum = Math.floor((d.getDate() - 1) / 7); 
                    if(weeks[weekNum] !== undefined) weeks[weekNum]++; 
                });

                document.getElementById('main-content').innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800">แดชบอร์ดส่วนตัว</h2>
                                <p class="text-xs text-slate-500">เดือน ${now.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' })}</p>
                            </div>
                            <button onclick="renderDashboard()" class="text-blue-500 p-2 bg-blue-50 rounded-full"><i class="fa-solid fa-rotate-right"></i></button>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-gradient-primary rounded-2xl p-4 text-white shadow-lg relative">
                                <p class="text-xs opacity-80">งานทั้งหมด</p>
                                <p class="text-3xl font-bold mt-1">${totalTasks}</p>
                                <p class="text-[10px] mt-2 opacity-80">${totalHours} ชม.</p>
                            </div>
                            <div class="space-y-3">
                                <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center">
                                    <div><p class="text-[10px] text-slate-400">Online</p><p class="text-xl font-bold text-emerald-600">${onlineCount}</p></div>
                                    <div class="w-8 h-8 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-600"><i class="fa-solid fa-video"></i></div>
                                </div>
                                <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center">
                                    <div><p class="text-[10px] text-slate-400">F2F</p><p class="text-xl font-bold text-blue-600">${f2fCount}</p></div>
                                    <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-blue-600"><i class="fa-solid fa-users"></i></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                            <h3 class="text-sm font-bold text-slate-700 mb-2">จำนวนคลาสรายสัปดาห์</h3>
                            <canvas id="weeklyChart" height="100"></canvas>
                        </div>
                        
                        <div class="space-y-4">

        async function handleSaveTask(e, taskId) {
            e.preventDefault(); 
            showLoading(true);
            
            const tSelect = document.getElementById('task-trainer');
            const trainers = tSelect.tagName === 'SELECT' ? Array.from(tSelect.selectedOptions).map(o=>o.value) : [tSelect.value];
            
            if(trainers.length === 0) { 
                alert('กรุณาเลือกผู้สอน'); 
                showLoading(false); 
                return; 
            }
            
            const isLeave = document.getElementById('is-leave').checked;
            const payload = { 
                date: document.getElementById('date').value, 
                is_leave: isLeave, 
                created_by: currentUser.id 
            };
            
            // Conflict Check Logic (New Tasks Only)
            if(!taskId) {
                for(const tid of trainers) {
                    const { data: existing } = await supabaseClient.from('tasks')
                        .select('*')
                        .eq('trainer_id', tid)
                        .eq('date', payload.date);
                    
                    if(existing && existing.length > 0) {
                        let conflictType = 'none'; 
                        let conflictTask = null;
                        const newFormat = document.getElementById('format').value;
                        const newStart = document.getElementById('start-time').value;
                        const newEnd = document.getElementById('end-time').value;

                        for(const t of existing) {
                            if(t.is_leave || isLeave) { 
                                conflictType = 'soft'; conflictTask = t; break; 
                            }
                            const hasTimeNew = newFormat !== '' && newStart && newStart !== '00:00';
                            const hasTimeOld = t.format && t.start_time !== '00:00:00' && t.start_time !== '00:00';

                            if(hasTimeNew && hasTimeOld) {
                                if(newStart < t.end_time && newEnd > t.start_time) { 
                                    conflictType = 'hard'; conflictTask = t; break; 
                                }
                            }
                            if(conflictType !== 'hard') { 
                                conflictType = 'soft'; conflictTask = t; 
                            }
                        }

                        if(conflictType === 'hard') { 
                            alert(`ไม่สามารถบันทึกได้: เวลาชนกับงาน "${conflictTask.course_details}"`); 
                            showLoading(false); return; 
                        }
                        if(conflictType === 'soft') {
                            const taskName = conflictTask.is_leave ? conflictTask.leave_type : conflictTask.course_details;
                            if(!confirm(`มีงาน "${taskName}" อยู่ในวันนี้แล้ว ยืนยันที่จะบันทึกเพิ่มหรือไม่?`)) { 
                                showLoading(false); return; 
                            }
                        }
                    }
                }
            }

            // Prepare Payload
            if(isLeave) { 
                payload.leave_type = document.getElementById('leave-type').value; 
                payload.start_time = '00:00'; 
                payload.end_time = '00:00'; 
            } else {
                payload.course_details = document.getElementById('course-details').value;
                const fmt = document.getElementById('format').value;
                payload.format = fmt === "" ? null : fmt;
                const aud = document.getElementById('audience').value;
                payload.audience = aud === "" ? null : aud;
                payload.location = document.getElementById('location').value;
                
                if(!payload.format) { 
                    payload.start_time = '00:00'; 
                    payload.end_time = '00:00'; 
                } else { 
                    payload.start_time = document.getElementById('start-time').value; 
                    payload.end_time = document.getElementById('end-time').value; 
                }
            }

            try {
                if(taskId) {
                    await supabaseClient.from('tasks').update(payload).eq('id', taskId);
                } else {
                    await supabaseClient.from('tasks').insert(trainers.map(id => ({...payload, trainer_id: id})));
                }
                alert('บันทึกสำเร็จ'); 
                renderDashboard();
            } catch(e) { 
                alert(e.message); 
            } finally { 
                showLoading(false); 
            }
        }

        async function renderTeamDashboard() {
            showLoading(true);
            const now = new Date();
            const start = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
            const end = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
            
            try {
                const { data: tasks } = await supabaseClient.from('tasks').select('*').gte('date', start).lte('date', end);
                const workload = {};
                tasks.forEach(t => { workload[t.trainer_id] = (workload[t.trainer_id] || 0) + 1; });
                
                const labels = [];

        async function runAvailabilityCheck() {
            showLoading(true);
            try {
                const group = document.getElementById('av-group').value;
                const mode = document.getElementById('av-mode').value;
                let ids = [];
                
                if(group === 'all') ids = allProfiles.filter(p=>p.role!=='master').map(p=>p.id);
                else if(group === 'specialist') ids = allProfiles.filter(p=>p.team==='Training Specialist').map(p=>p.id);
                else if(group === 'mandatory') ids = allProfiles.filter(p=>p.team==='Mandatory').map(p=>p.id);
                else ids = Array.from(document.querySelectorAll('.av-user-cb:checked')).map(cb => cb.value);
                
                if(ids.length === 0) { alert('กรุณาเลือกบุคคลก่อน'); showLoading(false); return; } 
                
                let startDate = new Date(); 
                let endDate = new Date(); 
                
                if (mode === 'month') { 
                    const mVal = document.getElementById('av-month-picker').value; 
                    if(!mVal) { alert('กรุณาเลือกเดือน'); showLoading(false); return; } 
                    startDate = new Date(mVal + '-01'); 
                    endDate = new Date(startDate.getFullYear(), startDate.getMonth() + 1, 0); 
                } else { 
                    endDate.setDate(startDate.getDate() + 60); 
                } 
                
                const { data: tasks } = await supabaseClient.from('tasks')
                    .select('date, trainer_id')
                    .in('trainer_id', ids)
                    .gte('date', startDate.toISOString().split('T')[0])
                    .lte('date', endDate.toISOString().split('T')[0]); 
                
                const busyMap = {}; 
                tasks.forEach(t => { 
                    if(!busyMap[t.date]) busyMap[t.date] = new Set(); 
                    busyMap[t.date].add(t.trainer_id); 
                }); 
                
                const resultContainer = document.getElementById('av-result'); 
                resultContainer.innerHTML = '<h3 class="font-bold mb-3">ผลการค้นหา</h3>'; 
                resultContainer.classList.remove('hidden'); 
                
                let found = false; 
                let current = new Date(startDate); 
                
                if(mode === 'earliest') {
                    while(current <= endDate) {
                        const dStr = current.toISOString().split('T')[0]; 
                        const conflict = [...(busyMap[dStr]||[])].some(uid=>ids.includes(uid)); 
                        if(!conflict && current.getDay()!==0 && current.getDay()!==6) { 
                            resultContainer.innerHTML = `<div class="p-4 bg-green-50 border border-green-200 rounded-xl text-center"><p class="text-green-800 font-bold text-lg">ว่างเร็วที่สุด!</p><p class="text-3xl font-bold text-green-600 my-2">${formatDateThai(dStr)}</p></div>`; 
                            found=true; break; 
                        } 
                        current.setDate(current.getDate()+1);
                    }
                } else {
                    let html = '<div class="grid grid-cols-4 gap-2">';
                    while(current <= endDate) {
                        const dStr = current.toISOString().split('T')[0]; 
                        const conflict = [...(busyMap[dStr]||[])].some(uid=>ids.includes(uid)); 
                        if(!conflict && current.getDay()!==0 && current.getDay()!==6) { 
                            html += `<div class="bg-green-100 text-green-700 p-2 rounded text-center text-xs font-bold">${current.getDate()}</div>`; 
                            found=true; 
                        } 
                        current.setDate(current.getDate()+1);
                    }
                    resultContainer.innerHTML = html + '</div>';
                }
                
                if(!found) resultContainer.innerHTML += '<p class="text-slate-500">ไม่พบวันว่างในช่วงเวลาที่กำหนด</p>';
            } catch(e) { alert(e.message); } finally { showLoading(false); }
        }

        // --- LINE REPORT ---
        async function generateLineReport() {
            showLoading(true);
            try {
                const d = new Date();
                d.setDate(d.getDate() + 1); // พรุ่งนี้
                const dateStr = d.toISOString().split('T')[0];
                
                const { data: tasks } = await supabaseClient.from('tasks')
                    .select('*, profiles!tasks_trainer_id_fkey(full_name, display_name, team)')
                    .eq('date', dateStr);
                
                let msg = `🗓️ ${formatDateThai(dateStr)}\n\n💙🧡 ttb Team 🧡💙\n.........................................\n`;
                
                // Custom Sorting (Safely handling if new people are added)
                const order1 = ['Thanayot', 'Yannapat', 'Natkanit', 'Pachara', 'Saowanee', 'Wattanapan', 'Arthaphan'];
                const order2 = ['Ananya', 'Nantida', 'Supaporn', 'Patchareeya', 'Suksawad'];
                
                const rank = (nameStr, orderArr) => {
                    if(!nameStr) return 99;
                    const firstName = nameStr.split(' ')[0];
                    const i = orderArr.findIndex(k => firstName.includes(k));
                    return i === -1 ? 99 : i; // ถ้าไม่เจอในลิสต์ให้ไปอยู่ท้ายสุด (99)
                };

                const printTeam = (teamName, orderArr) => {
                    msg += `🌟 ${teamName}\n`;
                    const teamMembers = allProfiles.filter(p => p.team === teamName);
                    
                    // Sort
                    teamMembers.sort((a,b) => rank(a.full_name, orderArr) - rank(b.full_name, orderArr));
                    
                    teamMembers.forEach(m => {
                        const memberTasks = tasks.filter(k => k.trainer_id === m.id);
                        msg += `● ${formatNameShort(m)}\n`;
                        
                        if (memberTasks.length === 0) {
                            msg += `- Office\n`; // Default if no tasks
                        } else {
                            memberTasks.forEach(k => {
                                msg += k.is_leave ? `- ${k.leave_type}\n` : `- ${buildTaskString(k)}\n`;
                            });
                        }
                        msg += `\n`;
                    });
                    msg += `.........................................\n`;
                };

                printTeam('Training Specialist', order1);
                printTeam('Mandatory', order2);

                document.getElementById('modal-content').innerHTML = `
                    <div class="p-4">
                        <h3 class="font-bold mb-2">Line Report (สำหรับพรุ่งนี้)</h3>
                        <textarea class="w-full h-64 text-xs border p-2 rounded bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">${msg}</textarea>
                        <button onclick="document.getElementById('modal-container').classList.add('hidden')" class="w-full mt-3 py-3 bg-slate-200 font-bold text-slate-700 rounded-xl hover:bg-slate-300">Close</button>
                    </div>`;
                document.getElementById('modal-container').classList.remove('hidden');
            } catch(e) { alert(e.message); } finally { showLoading(false); }
        }

        async function refreshAnalyticsData() {
            showLoading(true);
            const filter = document.getElementById('analytics-date-filter').value;
            const year = new Date().getFullYear();
            
            // Fetch all tasks for the current year
            const { data: allData, error } = await supabaseClient.from('tasks')
                .select('*')
                .gte('date', `${year}-01-01`)
                .lte('date', `${year}-12-31`);
            
            if(error) { showLoading(false); return alert('Analytics Error: ' + error.message); }
            rawTasks = allData;

            // Filter for KPIs based on dropdown
            let filteredTasks = [];
            const now = new Date();
            
            if(filter === 'ytd') {
                filteredTasks = rawTasks.filter(t => new Date(t.date) <= now);
            } else if (filter === 'this_month') {
                const start = new Date(year, now.getMonth(), 1);
                const end = new Date(year, now.getMonth() + 1, 0);
                filteredTasks = rawTasks.filter(t => new Date(t.date) >= start && new Date(t.date) <= end);
            } else if (filter === 'last_month') {
                const start = new Date(year, now.getMonth()-1, 1);
                const end = new Date(year, now.getMonth(), 0);
                filteredTasks = rawTasks.filter(t => new Date(t.date) >= start && new Date(t.date) <= end);
            }

            updateAnalyticsUI(filteredTasks);
            renderYearlyTrend();
            showLoading(false);
        }

        function updateAnalyticsUI(tasks) {
            // Update Top KPIs
            document.getElementById('ana-team-jobs').innerText = tasks.length;
            const hours = tasks.reduce((acc, t) => t.is_leave || !t.start_time ? acc : acc + (parseInt(t.end_time)-parseInt(t.start_time)), 0);
            document.getElementById('ana-team-hours').innerText = hours;
            const actives = new Set(tasks.map(t => t.trainer_id)).size;
            document.getElementById('ana-team-people').innerText = actives;

            // Update Workload Table
            const stats = {};
            allProfiles.filter(p => p.role !== 'master').forEach(p => { 
                stats[p.id] = { name: p.display_name || p.full_name, jobs: 0, hours: 0, online: 0, f2f: 0 }; 
            });
            
            tasks.forEach(t => {
                if(stats[t.trainer_id]) {
                    stats[t.trainer_id].jobs++;
                    if(t.format === 'Online') stats[t.trainer_id].online++;
                    if(t.format === 'F2F') stats[t.trainer_id].f2f++;
                    if(!t.is_leave && t.start_time) stats[t.trainer_id].hours += (parseInt(t.end_time) - parseInt(t.start_time));
                }
            });

            let html = '';
            Object.values(stats).forEach(s => {
                html += `
                    <tr class="border-b bg-white hover:bg-slate-50">
                        <td class="px-4 py-3 font-medium text-slate-900">${s.name}</td>
                        <td class="px-4 py-3 text-center">${s.jobs}</td>
                        <td class="px-4 py-3 text-center font-bold">${s.hours}</td>
                        <td class="px-4 py-3 text-center text-emerald-600">${s.online}</td>
                        <td class="px-4 py-3 text-center text-blue-600">${s.f2f}</td>
                    </tr>`;
            });
            document.getElementById('ana-table-body').innerHTML = html;
        }

        function renderYearlyTrend() {
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const monthlyData = Array(12).fill(0).map(() => ({ jobs: 0, hours: 0 }));
            
            rawTasks.forEach(t => {
                const m = new Date(t.date).getMonth();
                monthlyData[m].jobs++;
                if(!t.is_leave && t.start_time) monthlyData[m].hours += (parseInt(t.end_time) - parseInt(t.start_time));
            });
            
            window.cachedMonthly = monthlyData; // Store for toggle button
            
            let max = -1, pIndex = 0;
            monthlyData.forEach((d, i) => { if(d.jobs > max) { max = d.jobs; pIndex = i; } });
            
            document.getElementById('peak-month-text').innerHTML = `Peak Month: <b>${months[pIndex]}</b> (${max} assignments)`;
            updateTrendChart('jobs'); // default view
        }

        function updateTrendChart(metric) {
            const data = window.cachedMonthly.map(d => metric === 'jobs' ? d.jobs : d.hours);
            const color = metric === 'jobs' ? '#f59e0b' : '#3b82f6';
            
            // Toggle Button Styles
            document.getElementById('btn-trend-jobs').className = metric === 'jobs' 
                ? "px-3 py-1 text-xs font-bold rounded-md bg-white shadow text-blue-600 transition-all" 
                : "px-3 py-1 text-xs font-bold rounded-md text-slate-500 hover:text-blue-600 transition-all";
            document.getElementById('btn-trend-hours').className = metric === 'hours' 
                ? "px-3 py-1 text-xs font-bold rounded-md bg-white shadow text-blue-600 transition-all" 
                : "px-3 py-1 text-xs font-bold rounded-md text-slate-500 hover:text-blue-600 transition-all";

            const options = {
                series: [{ name: metric === 'jobs' ? 'Jobs' : 'Hours', data: data }],
                chart: { type: 'area', height: 250, toolbar: { show: false }, fontFamily: 'Prompt' },
                colors: [color],
                fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.7, opacityTo: 0.2, stops: [0, 90, 100] } },
                dataLabels: { enabled: true, style: { colors: [color], fontSize: '10px' } },
                stroke: { curve: 'smooth', width: 3 },
                xaxis: { categories: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'] },
                grid: { show: false }
            };
            
            if(trendChartInstance) trendChartInstance.destroy();
            trendChartInstance = new ApexCharts(document.querySelector("#yearTrendChart"), options);
            trendChartInstance.render();
        }

        // --- 8. EXPORT DATA (EXCEL) ---
        function renderExportModal() {
            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="p-6">
                    <h3 class="font-bold text-lg mb-4">📥 Export Data</h3>
                    
                    <div class="mb-4">
                        <label class="block text-xs font-bold text-slate-500 mb-1">ช่วงเวลา</label>
                        <select id="exp-range" class="input-rounded w-full px-4 py-2 text-sm" onchange="toggleExportDates()">
                            <option value="mtd">Month to Date (เดือนนี้)</option>
                            <option value="ytd">Year to Date (ปีนี้)</option>
                            <option value="custom">กำหนดเอง (Custom)</option>
                        </select>
                        <div id="exp-dates" class="hidden grid-cols-2 gap-2 mt-2">
                            <input type="date" id="exp-start" class="input-rounded w-full px-2 py-2 text-sm">
                            <input type="date" id="exp-end" class="input-rounded w-full px-2 py-2 text-sm">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-xs font-bold text-slate-500 mb-1">กลุ่มเป้าหมาย</label>
                        <select id="exp-target" class="input-rounded w-full px-4 py-2 text-sm" onchange="toggleExportUsers()">
                            <option value="all">ทุกคน (All Users)</option>
                            <option value="specialist">Training Specialist</option>
                            <option value="mandatory">Mandatory</option>
                            <option value="specific">ระบุบุคคล...</option>
                        </select>
                        <div id="exp-users" class="hidden mt-2 p-2 bg-slate-50 rounded-lg max-h-40 overflow-y-auto">
                            ${allProfiles.filter(p => p.role !== 'master').map(p => `
                                <label class="flex items-center gap-2 text-sm mb-1">
                                    <input type="checkbox" value="${p.id}" class="exp-user-cb"> ${formatNameShort(p)}
                                </label>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="flex gap-2 mt-6">
                        <button onclick="document.getElementById('modal-container').classList.add('hidden')" class="flex-1 py-3 border border-slate-200 rounded-xl text-sm font-bold text-slate-600">Cancel</button>
                        <button onclick="executeExport()" class="flex-1 py-3 bg-green-600 text-white rounded-xl text-sm font-bold shadow-md hover:bg-green-700">Download Excel</button>
                    </div>
                </div>`;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function toggleExportDates() { 
            document.getElementById('exp-dates').classList.toggle('hidden', document.getElementById('exp-range').value !== 'custom'); 
        }
        
        function toggleExportUsers() { 
            document.getElementById('exp-users').classList.toggle('hidden', document.getElementById('exp-target').value !== 'specific'); 
        }
        
        async function executeExport() {
            showLoading(true);
            try {
                // Determine Date Range
                const range = document.getElementById('exp-range').value;
                let start, end; 
                const now = new Date();
                
                if (range === 'mtd') { 
                    start = new Date(now.getFullYear(), now.getMonth(), 1); 
                    end = now; 
                } else if (range === 'ytd') { 
                    start = new Date(now.getFullYear(), 0, 1); 
                    end = now; 
                } else { 
                    start = new Date(document.getElementById('exp-start').value); 
                    end = new Date(document.getElementById('exp-end').value); 
                    if(isNaN(start) || isNaN(end)) throw new Error('กรุณาระบุวันที่เริ่มต้นและสิ้นสุดให้ถูกต้อง'); 
                }

                // Determine Users
                const target = document.getElementById('exp-target').value;
                let userIds = [];
                if (target === 'all') userIds = allProfiles.filter(p=>p.role!=='master').map(p=>p.id);
                else if (target === 'specialist') userIds = allProfiles.filter(p=>p.team==='Training Specialist').map(p=>p.id);
                else if (target === 'mandatory') userIds = allProfiles.filter(p=>p.team==='Mandatory').map(p=>p.id);
                else { 
                    userIds = Array.from(document.querySelectorAll('.exp-user-cb:checked')).map(cb=>cb.value); 
                    if(userIds.length === 0) throw new Error('กรุณาเลือกวิทยากรอย่างน้อย 1 คน'); 
                }

                // Query DB
                const { data: tasks, error } = await supabaseClient.from('tasks')
                    .select('*, profiles!tasks_trainer_id_fkey(full_name, team, role)')
                    .in('trainer_id', userIds)
                    .gte('date', start.toISOString().split('T')[0])
                    .lte('date', end.toISOString().split('T')[0]);
                
                if (error) throw error; 
                if (!tasks || tasks.length === 0) throw new Error('ไม่พบข้อมูลในช่วงเวลาและเงื่อนไขที่เลือก');

                // Map & Export Data
                const exportData = tasks.map(t => ({ 
                    Date: t.date, 
                    Start: t.start_time, 
                    End: t.end_time, 
                    Trainer: t.profiles?.full_name || 'Unknown', 
                    Team: t.profiles?.team || '', 
                    Course: t.course_details, 
                    Format: t.format, 
                    Audience: t.audience, 
                    Location: t.location, 
                    IsLeave: t.is_leave ? 'Yes' : 'No', 
                    LeaveType: t.leave_type 
                }));
                
                const ws = XLSX.utils.json_to_sheet(exportData); 
                const wb = XLSX.utils.book_new(); 
                XLSX.utils.book_append_sheet(wb, ws, "Tasks");
                XLSX.writeFile(wb, `Trainer_Export_${now.toISOString().split('T')[0]}.xlsx`);
                
                document.getElementById('modal-container').classList.add('hidden');
            } catch (e) { 
                alert(e.message); 
            } finally { 
                showLoading(false); 
            }
        }

        // Trigger auto login check
        supabaseClient.auth.getSession().then(({ data: { session } }) => { 
            if (session) initApp(session.user); 
        });

    </script>
</body>
